services:
  - type: web
    name: file-shield-watch
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && npm install && npm run build
    startCommand: gunicorn --chdir backend -w 1 -b 0.0.0.0:$PORT api.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9